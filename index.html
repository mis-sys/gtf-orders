<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTF Treads | Tread Rubber Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Theme tokens: palette follows www.gtftyres.com (dark header, white surfaces, blue accent). Change brand colours here only. */
:root{--ink:#1a1a1a;--bg:#f3f5f8;--card:#fff;--brand:#1f5fd6;--brand-d:#15439a;--tread:#f5b301;--line:#d5dbe3;--mute:#586271}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.45 Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:0;letter-spacing:.01em}

/* Contact bar */
.top{background:#e8ecf2;font-size:13.5px;border-bottom:1px solid var(--line)}
.top div{max-width:1240px;margin:0 auto;padding:6px 16px;display:flex;gap:4px 22px;flex-wrap:wrap;justify-content:flex-end}
.top a{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-weight:500;padding:2px 0}
.top a:hover{color:var(--brand);text-decoration:underline}
.top svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
header{position:sticky;top:0;z-index:4;background:var(--ink);color:#fff;border-bottom:4px solid var(--brand)}
.hd{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{flex:1;min-width:180px}.brand h1{font-size:34px;font-weight:700;letter-spacing:.02em}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav span{font-size:14px;color:#c9d1dc}
header .btn.y{outline:1px solid #ffffff44}

/* 3D buttons: raised at rest, lift on hover, press down on click */
.btn{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:8px;color:#fff;background:var(--brand);cursor:pointer;box-shadow:0 5px 0 var(--brand-d),0 8px 14px #0003;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--brand-d),0 12px 18px #0003}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-d),0 2px 4px #0003}
.btn.y{background:#2d333b;box-shadow:0 5px 0 #000,0 8px 14px #0003}.btn.y:hover{box-shadow:0 7px 0 #000,0 12px 18px #0003}.btn.y:active{box-shadow:0 1px 0 #000,0 2px 4px #0003}
.btn.s{padding:7px 12px;font-size:14px}.btn.on{background:#fff;color:var(--ink);box-shadow:0 5px 0 #9aa5b5}
.btn:disabled{filter:grayscale(.7) opacity(.6);cursor:not-allowed;transform:none;box-shadow:0 3px 0 #0003}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--tread);outline-offset:2px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:18px 16px 90px}.auth,.panel{background:var(--card);padding:24px;border-radius:12px;display:grid;gap:12px;border:1px solid var(--line)}.auth{max-width:440px;margin:30px auto}

/* Filters */
.bar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;margin-bottom:12px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.chip{border:0;border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:var(--c);color:var(--on)}.chip.dim{opacity:.4}
.count{color:var(--mute);margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}

/* Grade colours (Product Grade column): --c is the border, --bg2 the card tint */
.g-grn{--c:#2e7d32;--bg2:#e8f5e9;--on:#fff}.g-org{--c:#e65100;--bg2:#fff3e0;--on:#fff}.g-sky{--c:#0288d1;--bg2:#e1f5fe;--on:#fff}
.g-otr{--c:#bf360c;--bg2:#fbe9e7;--on:#fff}.g-red{--c:#c62828;--bg2:#ffebee;--on:#fff}.g-yel{--c:#fbc02d;--bg2:#fffde7;--on:#2b2400}
.g-navy{--c:#0d47a1;--bg2:#e8eaf6;--on:#fff}.g-pur{--c:#6a1b9a;--bg2:#f3e5f5;--on:#fff}.g-slate{--c:#455a64;--bg2:#eceff1;--on:#fff}.g-def{--c:#6b7480;--bg2:#eef0f3;--on:#fff}

/* Product card */
.card{background:var(--bg2);border:2px solid var(--c);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 6px #0001}
.card.sel{outline:3px solid var(--c);outline-offset:2px}
.gl{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:46px;padding:8px 12px 0;font-size:13px;font-weight:700;line-height:1.2}.gl b{flex:none;white-space:nowrap;background:var(--c);color:var(--on);padding:2px 10px;border-radius:99px}.gl span{color:var(--mute);font-weight:500;text-align:right}
.img{position:relative;margin:8px 12px 0;aspect-ratio:1/1;background:#fff;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.img img{width:100%;height:100%;object-fit:contain}.img.ph::after{content:'No image';color:var(--mute);font-size:14px}
.badge{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 12px 3px 9px;border-radius:99px}
.badge::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.ok{background:#d8f3e0;color:#0f6b2c;animation:pg 1.8s infinite}.badge.soon{background:#ffe9a8;color:#7a4a00;animation:pa 1.6s infinite}.badge.out{background:#e7e9ee;color:#4a5361}
@keyframes pg{0%{box-shadow:0 0 0 0 #1e8e3e99}70%{box-shadow:0 0 0 9px #1e8e3e00}100%{box-shadow:0 0 0 0 #1e8e3e00}}
@keyframes pa{0%,100%{box-shadow:0 0 0 0 #f5b30000}50%{box-shadow:0 0 12px 3px #f5b301aa}}
.yt{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:99px;background:#f00;color:#fff;font:inherit;font-weight:700;font-size:14px;padding:6px 14px 6px 8px;cursor:pointer;box-shadow:0 4px 0 #a30000,0 6px 10px #0004;transition:transform .08s,box-shadow .08s}
.yt:hover{transform:translateY(-2px);box-shadow:0 6px 0 #a30000,0 10px 14px #0004}.yt:active{transform:translateY(3px);box-shadow:0 1px 0 #a30000}.yt svg{width:28px;height:20px;flex:none}
.body{padding:10px 12px 14px;display:grid;gap:6px;flex:1;align-content:start}.body h3{font-size:25px;line-height:1.1}
.spec{font-weight:800;font-size:17px;line-height:1.25}.meta{color:var(--mute);font-size:14px}.stk{display:grid;gap:2px;font-size:14px}
.price{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:30px;font-weight:700;color:var(--brand-d)}.row{display:flex;gap:8px;align-items:center}.row input[type=number]{width:84px}
.more{display:block;margin:24px auto}

/* Video dialog */
dialog{border:0;border-radius:12px;padding:0;max-width:min(560px,94vw);width:100%}dialog::backdrop{background:#000b}
.vh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px}
dialog iframe,dialog video{width:100%;aspect-ratio:9/16;max-height:78vh;border:0;display:block;background:#000}

/* Cart drawer */
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:#fff;padding:18px;display:none;flex-direction:column;gap:10px;box-shadow:-8px 0 30px #0005;overflow:auto;z-index:8}#drawer.open{display:flex}
.line{display:grid;grid-template-columns:1fr 76px 36px;gap:8px;align-items:center;font-size:14px}.ln{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mx div{background:#eef2f8;border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.25;color:var(--mute)}.mx b{display:block;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.tot{border:2px solid var(--brand);border-radius:10px;padding:10px;display:grid;gap:8px}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}label.chk input{width:auto;margin-top:3px}
.err{color:#a3231a}.ok-t{color:#116b2f}.fab{position:fixed;right:18px;bottom:18px;z-index:4}

/* My orders and feedback */
.ord{display:grid;gap:10px;margin-bottom:16px}.trk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:13px;text-align:center}
.trk i{display:block;height:8px;border-radius:4px;background:var(--line);margin-bottom:4px}.trk .d i{background:var(--brand)}.trk .d{font-weight:700}.trk .c i{background:var(--tread);animation:pa 1.6s infinite}
.stars{display:flex;gap:6px}.stars button{font-size:28px;line-height:1;background:none;border:0;cursor:pointer;color:#c3ccc7;padding:2px}.stars button.on{color:var(--tread)}


/* Order tracker, support, history */
.st{margin:0;font-size:15px}.ord.hl{outline:3px solid var(--tread);outline-offset:2px}
.tl{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px}details summary{cursor:pointer;font-weight:600;color:var(--brand-d)}
.pill{border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700;background:#e7e9ee;color:#333}.p-open{background:#ffe9a8;color:#7a4a00}.p-inprogress{background:#d6e6ff;color:#0f3f91}.p-resolved,.p-closed{background:#d8f3e0;color:#0f6b2c}
.tk{margin-bottom:12px;gap:6px}.rp{background:#eef7f0;border-left:4px solid #2e7d32;padding:8px 10px;border-radius:6px;font-size:14px}
.fl{display:inline-flex;gap:6px;align-items:center;background:#eef2f8;border-radius:99px;padding:3px 6px 3px 12px;font-size:13px}.fl button{border:0;background:none;font-size:18px;cursor:pointer;line-height:1}
audio{max-width:100%}@media(max-width:560px){.trk{font-size:11px;gap:3px}}
@media(max-width:820px){.bar{grid-template-columns:1fr 1fr}.bar>:first-child{grid-column:1/-1}.top div{justify-content:center}.brand h1{font-size:28px}}
@media(max-width:560px){.top div{gap:2px 16px;padding:5px 12px}.top .n{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<header><div class="hd"><div class="brand"><h1>GTF Treads</h1></div>
<nav id="nav" hidden><button class="btn s on" data-v="shop">Catalogue</button><button class="btn s" data-v="orders">My Orders</button><button class="btn s" data-v="support">Support</button><button class="btn s" data-v="fb">Feedback</button><span id="who"></span><button class="btn s y" id="out">Sign out</button></nav></div></header>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={tok:localStorage.gtfTok||'',name:localStorage.gtfName||'',role:localStorage.gtfRole||'',items:[],cart:{},orders:[],view:'shop',q:'',group:'',grade:'',size:'',shown:48,uid:'',mode:'signin',poll:0,fb:{kind:'order',r:0},sup:{files:[],voice:null,order:''},deep:Object.fromEntries(new URLSearchParams(location.search)),fbOrder:''};
const fmt=n=>Number(n).toLocaleString('en-IN',{maximumFractionDigits:2}),inr=n=>'\u20B9'+fmt(n);
async function api(a,p={}){const r=await fetch('/.netlify/functions/api',{method:'POST',body:JSON.stringify({action:a,token:S.tok,...p})});const j=await r.json();if(!j.ok)throw new Error(j.error);return j.data}
const view=h=>$('#app').innerHTML=h;
const round=n=>Math.round(n*100)/100;
/* Order maths. The customer enters PACKS; units = packs x Units Per Pack (col M); quantity = units x Unit Weight (col K). */
const calc=(i,p)=>{const units=p*i.perPack,qty=round(units*i.unitWt);return{packs:p,units,qty,amt:round(qty*(i.price||0))}};
const grp=(L,kf,vf)=>{const m={};L.forEach(x=>{const k=kf(x);m[k]=(m[k]||0)+vf(x)});return Object.keys(m).map(k=>`${fmt(round(m[k]))} ${esc(k)}`).join(' + ')||'0'};
/* Grade (col D) -> colour class. Order matters: OTR and Premium are tested before the generic "special". */
function gk(g){g=String(g||'').toLowerCase().trim();if(/otr/.test(g))return'otr';if(/premium/.test(g))return'org';if(/kissan|special/.test(g))return'sky';if(/ultra/.test(g))return'red';if(/\brtu\b/.test(g))return'yel';if(/\bee?co\b/.test(g))return'navy';if(/\buts\b/.test(g))return'pur';if(/\bbg\b/.test(g))return'slate';if(/green/.test(g))return'grn';return'def'}
/* Stock state comes from the server: packs (col AA) > 0 = in stock; otherwise "coming soon" if the Status column says so; otherwise out of stock. */
function stock(i){if(i.state==='in')return{c:'ok',t:'In Stock',o:1};if(i.state==='soon')return{c:'soon',t:'Coming Soon',o:0};return{c:'out',t:'Out of Stock',o:1}}
const thumb=u=>{const m=/\/d\/([\w-]+)/.exec(u||'')||/id=([\w-]+)/.exec(u||'');return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`:(u||'')};
const ytIcon='<svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="6" fill="#fff"/><path d="M11 5.5l8 4.5-8 4.5z" fill="#f00"/></svg>';
function play(u,t){const y=/(?:shorts\/|v=|youtu\.be\/)([\w-]{11})/.exec(u||'');$('#vt').textContent=t||'Product video';$('#vbox').innerHTML=y?`<iframe title="Product video" src="https://www.youtube.com/embed/${y[1]}?autoplay=1&rel=0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`:`<video src="${esc(u)}" controls autoplay playsinline></video>`;vid.showModal()}
vid.addEventListener('close',()=>$('#vbox').innerHTML='');
function auth(msg=''){clearInterval(S.poll);$('#nav').hidden=true;const reg=S.mode==='register',otp=!!S.uid;
 view(`<form class="auth" id="af"><h2>${otp?'Enter your code':reg?'Create your account':'Sign in'}</h2>${otp?`<input name="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" aria-label="6-digit code" required autofocus>`:`
 ${reg?`<input name="name" placeholder="Your name" required><input name="company" placeholder="Company name" required><input name="mobile" placeholder="Mobile number" required><input name="email" type="email" placeholder="Email" required><input name="whatsapp" placeholder="WhatsApp number" required>`:''}
 <select name="channel" aria-label="Where to send the code"><option value="email">Send code to my email</option><option value="mobile">Send code to my mobile</option><option value="whatsapp">Send code to my WhatsApp</option></select>${reg?'':'<input name="to" placeholder="Registered email, mobile or WhatsApp" required>'}`}
 <button class="btn">${otp?'Verify and continue':'Send code'}</button><div class="err" role="alert">${esc(msg)}</div>${otp?'':`<a href="#" id="sw">${reg?'I already have an account':'New here? Create an account'}</a>`}</form>`);
 $('#sw')&&($('#sw').onclick=e=>{e.preventDefault();S.mode=reg?'signin':'register';auth()});
 $('#af').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{
  if(otp){const d=await api('verifyOtp',{userId:S.uid,code:f.code});Object.assign(S,{tok:d.token,name:d.name,role:d.role});localStorage.gtfTok=d.token;localStorage.gtfName=d.name;localStorage.gtfRole=d.role;S.uid='';load()}
  else{if(reg)f.to=f[f.channel];const d=await api('requestOtp',{...f,register:reg});S.uid=d.userId;auth()}}catch(x){auth(x.message)}}}
async function load(){$('#nav').hidden=false;$('#who').textContent=S.name+' ('+S.role+')';view('<p>Loading catalogue...</p>');
 try{const c=JSON.parse(localStorage.gtfCat2||'null');if(c&&c.k===S.tok&&c.t>Date.now()-12e4)S.items=c.d;else{S.items=await api('catalogue');localStorage.gtfCat2=JSON.stringify({t:Date.now(),k:S.tok,d:S.items})}}
 catch(x){S.tok='';localStorage.clear();return auth(x.message)}
 const d=S.deep;history.replaceState(null,'',location.pathname);if(d.order&&d.survey){S.fbOrder=d.order;S.deep={};go('fb')}else if(d.order)go('orders');else go('shop')}
function go(v){S.view=v;clearInterval(S.poll);document.querySelectorAll('#nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#cb')&&0;
 if(v==='shop')shop();else if(v==='orders')orders();else if(v==='support')support();else feedback()}
$('#nav').onclick=e=>e.target.dataset.v&&go(e.target.dataset.v);$('#out').onclick=()=>{localStorage.clear();location.reload()};
const uniq=k=>[...new Set(S.items.map(i=>String(i[k]||'').trim()).filter(Boolean))].sort();
const opts=(a,v,all)=>`<option value="">${all}</option>`+a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
function shop(){const gr=uniq('grade');
 view(`<div class="bar"><label class="f">Search<input id="q" type="search" value="${esc(S.q)}" placeholder="Pattern, code, size, width or grade"></label><label class="f">Product group<select id="fg">${opts(uniq('group'),S.group,'All product groups')}</select></label><label class="f">Grade<select id="fd">${opts(gr,S.grade,'All grades')}</select></label><label class="f">Size<select id="sz">${opts(uniq('size'),S.size,'All sizes')}</select></label><button class="btn s y" id="clr" style="align-self:end">Clear</button></div>
 <div class="legend" id="lg">${gr.map(g=>`<button class="chip g-${gk(g)}${S.grade&&S.grade!==g?' dim':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div><p class="count" id="ct" aria-live="polite"></p><div class="grid" id="g"></div><button class="btn more" id="mo">Show more</button><button class="btn fab" id="cb"></button>`);
 const set=(k,v)=>{S[k]=v;S.shown=48;draw()};$('#q').oninput=e=>set('q',e.target.value);$('#fg').onchange=e=>set('group',e.target.value);$('#fd').onchange=e=>{S.grade=e.target.value;shop()};$('#sz').onchange=e=>set('size',e.target.value);
 $('#clr').onclick=()=>{Object.assign(S,{q:'',group:'',grade:'',size:'',shown:48});shop()};$('#lg').onclick=e=>{const g=e.target.dataset.g;if(g){S.grade=S.grade===g?'':g;S.shown=48;shop()}};
 $('#mo').onclick=()=>{S.shown+=48;draw()};$('#cb').onclick=()=>{$('#drawer').classList.add('open');cart()};
 if(S.io)S.io.disconnect();S.io=new IntersectionObserver(e=>{if(e[0].isIntersecting&&!$('#mo').hidden){S.shown+=48;draw()}},{rootMargin:'500px'});S.io.observe($('#mo'));
 $('#g').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v){const i=S.items.find(x=>x.code==b.dataset.v);play(i.video,i.pattern)}if(b.dataset.a){S.cart[b.dataset.a]=Math.max(1,Math.floor(+$('[id="n-'+b.dataset.a+'"]').value)||1);draw()}};draw()}
function draw(){const q=S.q.toLowerCase().trim(),L=S.items.filter(i=>(!S.group||i.group===S.group)&&(!S.grade||i.grade===S.grade)&&(!S.size||String(i.size)===S.size)&&(!q||[i.code,i.pattern,i.size,i.width,i.grade,i.group,i.app,i.vehicle,i.load].join(' ').toLowerCase().includes(q)));

const STEPS=['Order placed','Sales reviewed','Accounts approved','Scheduled','Dispatched'];
const dshort=s=>s?new Date(/^\d{4}-\d\d-\d\d$/.test(s)?s+'T00:00:00':s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';

function ostate(o){const s=o.status;return s==='Placed'?'Waiting for our sales team to review it.':s==='Sales Reviewed'?'Sales reviewed. Waiting for accounts approval.':s==='Accounts Approved'?'Approved. Production is planning your dispatch date.':

 s==='Dispatched'?'Fully dispatched on '+dshort(o.dispatched)+'. On its way to you.':s==='Delivered'?'Delivered on '+dshort(o.delivered)+'.':esc(s)}
function ocard(o){const k=o.step,final=o.status==='Dispatched'||o.status==='Delivered',moved=o.plan&&o.promised&&o.plan!==o.promised&&!o.dateUnderReview;

 `<div class="trk" role="img" aria-label="Order progress: ${esc(o.status)}">${STEPS.map((s,j)=>`<div class="${j<k?'d':j===k&&!final?'d c':''}"><i></i>${s}</div>`).join('')}</div><p class="st">${ostate(o)}</p>`}
 ${moved?`<p class="meta">First promised ${dshort(o.promised)}, now ${dshort(o.plan)}${o.planReason?' ('+esc(o.planReason)+')':''}.</p>`:''}
 ${o.items.map(i=>`<div class="meta"><b>${esc(i.pattern)}</b> ${esc(i.size)}: ${fmt(i.sent||0)} of ${fmt(i.ordered)} ${esc(i.packType)} dispatched</div>`).join('')}
 ${o.timeline&&o.timeline.length>1?`<details><summary>History</summary><ul class="tl">${o.timeline.map(e=>`<li><b>${esc(e.a)}</b> <span class="meta">${dtime(e.t)}</span></li>`).join('')}</ul></details>`:''}
 <div class="row" style="flex-wrap:wrap"><button class="btn s y" data-q="${esc(o.no)}">Ask about this order</button>${o.status==='Delivered'?(o.feedbackDone?'<span class="ok-t">Feedback received. Thank you.</span>':`<button class="btn s" data-f="${esc(o.no)}">Give feedback</button>`):''}</div></section>`}
async function orders(){view('<p>Loading your orders...</p>');let last='';const paint=async()=>{try{S.orders=await api('myOrders')}catch(x){return view(`<p class="err">${esc(x.message)}</p>`)}if(S.view!=='orders')return;
 const sig=JSON.stringify(S.orders);if(sig===last)return;last=sig;
 view(`<h2>My Orders</h2>${S.orders.map(ocard).join('')||'<p>You have no orders yet. Add products to your cart in the Catalogue.</p>'}<p class="meta">Status refreshes every 30 seconds.</p>`);

const rdb=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
async function shrink(f){if(!/^image\//.test(f.type))return f;try{const b=await createImageBitmap(f),s=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 return await new Promise(ok=>c.toBlob(x=>ok(new File([x],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})),'image/jpeg',.72))}catch(e){return f}}

 <label class="f">What is it about?<select id="sc">${d.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>

 <div class="row" style="flex-wrap:wrap"><label class="btn s y" style="cursor:pointer">Add photos / PDF<input id="sp" type="file" accept="image/*,application/pdf" multiple hidden></label><button type="button" class="btn s y" id="rc">&#9679; Record voice note</button></div>

 <h3 style="margin:22px 0 10px">My queries</h3>${d.tickets.map(t=>`<section class="panel tk"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><b>${esc(t.id)}</b><span class="pill p-${esc(t.status.replace(/\s/g,'').toLowerCase())}">${esc(t.status)}</span></div>
 <div class="meta">${esc(t.cat)}${t.order?' &middot; '+esc(t.order):''} &middot; ${dshort(t.created)}</div><div>${esc(t.msg)}</div>${t.reply?`<div class="rp"><b>Our reply:</b> ${esc(t.reply)}</div>`:''}</section>`).join('')||'<p class="meta">No queries yet.</p>'}`);
 const files=U.files=[];U.voice=null;const list=()=>{$('#sl').innerHTML=files.map((f,i)=>`<span class="fl">${esc(f.name)} (${Math.round(f.size/1024)} KB) <button type="button" data-x="${i}" aria-label="Remove ${esc(f.name)}">&times;</button></span>`).join(' ')};
